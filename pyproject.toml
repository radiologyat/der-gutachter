[project]
name = "gutachten"
version = "1.0.0"
description = "Local-only assistant for orthopedic Gutachten: Akten-Digitalisierung, Aktenauszug, Widerspruchsanalyse, Entwurf. No patient data ever leaves the machine."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pymupdf>=1.24.0",
    "pillow>=10.4.0",
    "opencv-python-headless>=4.10.0",
    "imagehash>=4.3.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.2",
    "psutil>=6.0",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
desktop = [
    "pywebview>=6.2.1",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gutachten"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
